name: OmniVoice Nepali sample

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Nepali text to synthesize (no voice reference or cloning is used)"
        required: true
        default: "नमस्कार! आजको राशिफलमा तपाईंलाई स्वागत छ।"
        type: string

permissions:
  contents: read

jobs:
  generate-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system audio dependency
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install OmniVoice
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0
          python -m pip install omnivoice soundfile

      - name: Generate Nepali sample without voice cloning
        env:
          SAMPLE_TEXT: ${{ inputs.text }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os
          import soundfile as sf
          import torch
          from omnivoice import OmniVoice

          text = os.environ["SAMPLE_TEXT"].strip()
          if not text:
              raise SystemExit("Input text must not be empty")

          # No reference audio or transcript: OmniVoice uses an automatic voice.
          model = OmniVoice.from_pretrained(
              "k2-fsa/OmniVoice",
              device_map="cpu",
              dtype=torch.float32,
          )
          audio = model.generate(text=text, language_id="npi", num_step=16)
          sf.write("output/omnivoice-nepali-sample.wav", audio[0], 24000)
          print("Generated output/omnivoice-nepali-sample.wav")
          PY

      - name: Upload sample audio
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-nepali-sample
          path: output/omnivoice-nepali-sample.wav
          if-no-files-found: error
          retention-days: 7
